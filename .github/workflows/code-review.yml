name: Code Review

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: number
      auto_resolve_enabled:
        required: false
        type: boolean
        default: true
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

permissions:
  contents: write # Write required for workflow operations
  pull-requests: write
  issues: write
  id-token: write

env:
  STYLEGUIDE_DIR: '.github/review-rules' # written by eque2-code [IS]

jobs:
  # Job 1: Use Claude Code to detect which existing comments are fixed
  detect-fixed-issues:
    if: inputs.auto_resolve_enabled
    runs-on: ubuntu-latest
    outputs:
      has_fixes: ${{ steps.check-output.outputs.has_fixes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build detection prompt
        id: build-detect-prompt
        run: |
          PROMPT=$(cat .github/prompts/detect-fixed-issues.md)
          PROMPT="${PROMPT//\{PR_NUMBER\}/${{ inputs.pr_number }}}"
          PROMPT="${PROMPT//\{owner\}/${{ github.repository_owner }}}"
          PROMPT="${PROMPT//\{repo\}/${{ github.event.repository.name }}}"

          echo "prompt<<EOFPROMPT" >> $GITHUB_OUTPUT
          echo "$PROMPT" >> $GITHUB_OUTPUT
          echo "EOFPROMPT" >> $GITHUB_OUTPUT

      - name: Claude Code - Detect Fixed Issues
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: ${{ steps.build-detect-prompt.outputs.prompt }}
          show_full_output: true
          settings: |
            {
              "permissions": {
                "allow": ["Bash", "Read", "Write"]
              }
            }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload fixed issues artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: fixed-issues
          path: fixed-issues.json
          if-no-files-found: ignore

      - name: Check if fixes were found
        id: check-output
        run: |
          if [ -f fixed-issues.json ] && [ "$(jq '.fixed | length' fixed-issues.json)" -gt 0 ]; then
            echo "has_fixes=true" >> $GITHUB_OUTPUT
            echo "Found $(jq '.fixed | length' fixed-issues.json) fixed issues"
          else
            echo "has_fixes=false" >> $GITHUB_OUTPUT
            echo "No fixed issues found"
          fi

  # Job 2: Use deterministic bash to resolve threads (guaranteed execution)
  resolve-threads:
    needs: detect-fixed-issues
    if: needs.detect-fixed-issues.outputs.has_fixes == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Download fixed issues artifact
        uses: actions/download-artifact@v5
        with:
          name: fixed-issues

      - name: Resolve fixed threads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Processing fixed issues..."

          # Parse JSON and resolve each thread
          jq -r '.fixed[] | @json' fixed-issues.json | while read -r item; do
            THREAD_ID=$(echo "$item" | jq -r '.thread_id')
            COMMENT_ID=$(echo "$item" | jq -r '.comment_id')
            FILE=$(echo "$item" | jq -r '.file')
            RESOLUTION=$(echo "$item" | jq -r '.resolution')

            echo "Resolving thread $THREAD_ID (comment $COMMENT_ID)"

            # Post resolution reply with proper JSON escaping
            BODY=$(jq -n --arg resolution "$RESOLUTION" --arg comment_id "$COMMENT_ID" '{"body": ("✅ **Issue Resolved** - " + $resolution), "in_reply_to": ($comment_id | tonumber)}')
            gh api repos/${{ github.repository }}/pulls/${{ inputs.pr_number }}/comments \
              --input - <<< "$BODY" || echo "Failed to post reply to $COMMENT_ID"

            # Resolve thread via GraphQL
            gh api graphql -f query="mutation { resolveReviewThread(input: {threadId: \"$THREAD_ID\"}) { thread { id isResolved } } }" \
              || echo "Failed to resolve thread $THREAD_ID"

            echo "✓ Resolved: $FILE"
          done

          echo "Completed resolving $(jq '.fixed | length' fixed-issues.json) threads"

  # Job 3: Normal code review (runs always, waits for resolve if enabled)
  code-review:
    if: always()
    needs: [detect-fixed-issues]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for style guides
        id: styleguides
        run: |
          if [ -d "$STYLEGUIDE_DIR" ] && [ "$(ls -A "$STYLEGUIDE_DIR"/*.md 2>/dev/null)" ]; then
            echo "Styleguides directory found"
            echo "has_styleguides=true" >> $GITHUB_OUTPUT
            echo "styleguide_dir=$STYLEGUIDE_DIR" >> $GITHUB_OUTPUT
          else
            echo "No styleguides directory found"
            echo "has_styleguides=false" >> $GITHUB_OUTPUT
            echo "styleguide_dir=" >> $GITHUB_OUTPUT
          fi

      - name: Delete previous code review summary
        uses: actions/github-script@v8
        with:
          script: |
            const deleteComments = require('${{ github.workspace }}/.github/scripts/delete-comments.js');
            const marker = '<!-- ai-workflow:code-review-summary -->';
            await deleteComments({ github, context, marker, prNumber: ${{ inputs.pr_number }} });

      - name: Build code review prompt
        id: build-prompt
        shell: bash
        run: |
          # Always use basic template - resolution is handled in separate jobs
          PROMPT_FILE=".github/prompts/code-review-basic.md"
          echo "Using basic code review template"

          # Validate template exists
          if [ ! -f "$PROMPT_FILE" ]; then
            echo "Error: Prompt template not found: $PROMPT_FILE"
            exit 1
          fi

          # Load template
          PROMPT=$(cat "$PROMPT_FILE")

          # Build styleguide section
          STYLEGUIDE_SECTION=""
          if [ "${{ steps.styleguides.outputs.has_styleguides }}" = "true" ]; then
            STYLEGUIDE_DIR="${{ steps.styleguides.outputs.styleguide_dir }}"
            if [ -d "$STYLEGUIDE_DIR" ]; then
              STYLEGUIDE_FILES=$(find "$STYLEGUIDE_DIR" -name "*.md" -exec basename {} \; | tr '\n' ', ' | sed 's/,$//')
            else
              STYLEGUIDE_FILES="(directory not found)"
            fi

            STYLEGUIDE_SECTION="

          ## Coding Standards - REQUIRED REVIEW

          **Styleguides in ${STYLEGUIDE_DIR}:**
          $STYLEGUIDE_FILES

          **MANDATORY:** Review ALL changed files against applicable styleguides.

          **Process:**
          1. List ALL changed source files (.ts, .html, .scss, .js, etc.)
          2. For EACH file, check against relevant styleguide rules
          3. Post inline comments for violations
          4. Provide summary of files reviewed

          **Do NOT skip files.** Systematic review required."
          fi

          # Simple placeholder substitution
          PROMPT="${PROMPT//\{STYLEGUIDE_SECTION\}/$STYLEGUIDE_SECTION}"
          PROMPT="${PROMPT//\{PR_NUMBER\}/${{ inputs.pr_number }}}"
          PROMPT="${PROMPT//\{owner\}/${{ github.repository_owner }}}"
          PROMPT="${PROMPT//\{repo\}/${{ github.event.repository.name }}}"

          # Output
          echo "prompt<<EOFPROMPT" >> $GITHUB_OUTPUT
          echo "$PROMPT" >> $GITHUB_OUTPUT
          echo "EOFPROMPT" >> $GITHUB_OUTPUT

      - name: Claude Code PR Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: ${{ steps.build-prompt.outputs.prompt }}
          show_full_output: true
          settings: |
            {
              "permissions": {
                "allow": ["Bash", "Read", "Write", "Edit"]
              }
            }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
