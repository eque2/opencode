<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jev Router for opencode</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: fixed 1920×1080 canvas scaled to the window; light slides for the story, dark slides for code. */
:root {
  --light: #F3F5F1; --card: #FBFCF9; --line: #D5DDD8; --ink: #14211E; --body: #44524E; --muted: #5E6D68;
  --teal: #0D7565; --teal-soft: #DCEDE8; --tool: #2D5FA8; --skill: #A3560A; --bar: #C9D2CD;
  --dark: #14211E; --panel: #1D2C28; --on-dark: #BFD2CB; --on-dark-muted: #93A8A0;
  --code: #DCE6E1; --c-comment: #93A8A0; --c-string: #E8B36B; --c-word: #86C5F0; --c-key: #9FD8C5;
  --display: "Bricolage Grotesque", Georgia, serif;
  --text: "IBM Plex Sans", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
html, body { height: 100%; margin: 0; background: #0B1210; }
#viewport { position: fixed; inset: 0; display: grid; place-items: center; overflow: hidden; }
#stage { width: 1920px; height: 1080px; position: relative; flex: none; }
.slide {
  position: absolute; inset: 0; box-sizing: border-box; padding: 96px 128px 120px;
  display: none; flex-direction: column; gap: 32px; overflow: hidden;
  background: var(--light); color: var(--body); font: 28px/1.45 var(--text);
}
.slide.on { display: flex; }
.slide.dark { background: var(--dark); color: var(--on-dark); }
.slide.teal { background: var(--teal); color: var(--light); }
.slide.code { padding: 80px 128px 80px; gap: 28px; }
.eyebrow { font: 600 24px/1 var(--text); letter-spacing: 0.08em; text-transform: uppercase; color: var(--teal); margin: 0; }
.dark .eyebrow { color: var(--c-key); }
.teal .eyebrow { color: var(--teal-soft); }
h1, h2, h3 { font-family: var(--display); color: var(--ink); margin: 0; text-wrap: balance; }
.dark h1, .dark h2, .teal h1, .teal h2 { color: var(--light); }
h1 { font-size: 112px; line-height: 1.02; font-weight: 700; letter-spacing: -0.02em; }
h2 { font-size: 56px; line-height: 1.12; font-weight: 650; letter-spacing: -0.01em; }
h2.long { font-size: 44px; }
.code h2 { font-size: 44px; }
h3 { font-size: 36px; line-height: 1.2; font-weight: 600; }
p { margin: 0; }
.lede { font-size: 36px; line-height: 1.4; max-width: 1400px; }
.small { font-size: 24px; color: var(--muted); }
.dark .small { color: var(--on-dark-muted); }
.mono { font-family: var(--mono); }
.tool { color: var(--tool); }
.skill { color: var(--skill); }
.row { display: flex; gap: 32px; }
.grow { flex: 1; min-width: 0; }
.footer {
  position: absolute; left: 128px; right: 128px; bottom: 44px; display: flex; justify-content: space-between;
  font: 22px/1 var(--text); color: var(--muted);
}
.dark .footer { color: var(--on-dark-muted); }
.teal .footer { color: var(--teal-soft); }

/* Cards and chips */
.card { background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 28px; display: flex; flex-direction: column; gap: 12px; }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
.card-head .mono { font-size: 26px; font-weight: 600; }
.tag { font: 600 20px/1 var(--text); letter-spacing: 0.06em; text-transform: uppercase; }
.desc { font-size: 24px; line-height: 1.42; color: var(--ink); white-space: pre-line; }
.more { font-size: 22px; color: var(--muted); font-style: italic; }
.strip { display: flex; flex-direction: column; gap: 0; }
.strip .tag { margin-bottom: 12px; }
.toolrow { display: grid; grid-template-columns: 150px 1fr auto; gap: 24px; align-items: baseline; padding: 10px 0; border-bottom: 1px solid var(--line); }
.toolrow .mono { font-size: 24px; font-weight: 600; }
.toolrow .first { font-size: 24px; color: var(--ink); }
.why { font-size: 28px; line-height: 1.4; color: var(--ink); border-left: 4px solid var(--teal); padding-left: 20px; }
.chips { display: flex; flex-wrap: wrap; gap: 12px; }
.chip { font: 24px/1 var(--mono); padding: 12px 16px; border-radius: 999px; background: var(--card); border: 2px solid var(--line); }
.chip.tool { border-color: #B9CBE6; }
.chip.skill { border-color: #E6CBAE; }

/* Prompt and transcript */
.you { background: var(--ink); color: var(--light); border-radius: 20px; padding: 28px 32px; display: flex; flex-direction: column; gap: 10px; }
.you .who { font: 600 22px/1 var(--text); letter-spacing: 0.08em; text-transform: uppercase; color: var(--c-key); }
.you .said { font-size: 34px; line-height: 1.35; }
.transcript { display: flex; flex-direction: column; gap: 14px; }
.call { font: 26px/1.35 var(--mono); color: var(--ink); display: flex; gap: 16px; }
.call .verb { font-weight: 600; min-width: 110px; }
.call .out { color: var(--muted); }
.reply { font-size: 32px; line-height: 1.45; color: var(--ink); white-space: pre-line; max-width: 1500px; }
.agent { font: 600 22px/1 var(--text); letter-spacing: 0.08em; text-transform: uppercase; color: var(--teal); }

/* Score chart */
.chart { display: flex; flex-direction: column; gap: 8px; }
.chart .r { display: grid; grid-template-columns: 370px 76px 300px 72px 72px 96px; gap: 16px; align-items: center; }
.chart .h { font: 600 20px/1.2 var(--text); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.chart .name { font: 24px/1.2 var(--mono); color: var(--ink); white-space: nowrap; }
.chart .num { font: 24px/1 var(--mono); text-align: right; font-variant-numeric: tabular-nums; color: var(--ink); }
.chart .conf { color: var(--muted); }
.chart .track { position: relative; height: 24px; background: #E4EAE6; border-radius: 6px; }
.chart .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; background: var(--bar); }
.chart .fill.kept.tool { background: var(--tool); }
.chart .fill.kept.skill { background: var(--skill); }
.chart .line { position: absolute; top: -8px; bottom: -8px; width: 3px; left: 40%; background: var(--ink); }
.chart .dec { font: 600 24px/1 var(--text); }
.chart .dec.kept { color: var(--teal); }
.chart .dec.dropped { color: var(--muted); font-weight: 400; }
.chart .rest { font-size: 24px; color: var(--muted); padding-top: 6px; }
.stat { display: flex; flex-direction: column; gap: 4px; }
.stat b { font: 700 44px/1.1 var(--display); color: var(--ink); }
.stat span { font-size: 24px; color: var(--muted); }

/* Big numbers */
.big { display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px; }
.big .n { font: 700 120px/1 var(--display); color: var(--ink); letter-spacing: -0.03em; }
.big .u { font-size: 30px; color: var(--body); margin-top: 16px; }

/* Tables */
table { border-collapse: collapse; width: 100%; font-size: 28px; }
th { text-align: left; font: 600 22px/1.2 var(--text); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); padding: 0 20px 14px 0; border-bottom: 2px solid var(--line); }
td { padding: 16px 20px 16px 0; border-bottom: 1px solid var(--line); vertical-align: top; color: var(--ink); }
td.mono { font-size: 24px; }
td.num { font-family: var(--mono); font-size: 26px; font-variant-numeric: tabular-nums; }

/* Code */
.codebox { background: var(--panel); border-radius: 18px; padding: 32px 40px; flex: 1; min-height: 0; overflow: hidden; }
.codebox pre { margin: 0; font: 22px/1.38 var(--mono); color: var(--code); white-space: pre-wrap; overflow-wrap: anywhere; }
.codebox.light { background: var(--ink); }
.c { color: var(--c-comment); font-style: italic; }
.s { color: var(--c-string); }
.w { color: var(--c-word); }
.k { color: var(--c-key); }
.n { color: #F2A0A0; }
.caption { font-size: 24px; color: var(--on-dark-muted); }

/* Choice vs Score */
.vs { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
.vs .card { gap: 20px; padding: 36px; }
.verdict { font-size: 30px; color: var(--ink); }
.vs .chart .r { grid-template-columns: 340px 70px 160px 72px; }
.vs { align-items: start; }
.card p .mono { white-space: nowrap; }

/* Chrome outside the slide */
#nav { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 8px; align-items: center;
  font: 14px/1 var(--text); color: #93A8A0; opacity: 0.25; transition: opacity 0.2s; }
#nav:hover, #nav:focus-within { opacity: 1; }
#nav button { font: 600 14px/1 var(--text); color: #DCE6E1; background: #1D2C28; border: 1px solid #2F423C; border-radius: 8px; padding: 8px 12px; cursor: pointer; }
#nav button:focus-visible { outline: 2px solid #9FD8C5; outline-offset: 2px; }
#notes { position: fixed; left: 0; right: 0; bottom: 0; max-height: 34vh; overflow: auto; background: #0F1A17; color: #DCE6E1;
  font: 18px/1.5 var(--text); padding: 18px 28px 56px; border-top: 1px solid #2F423C; }
@media (prefers-reduced-motion: reduce) { #nav { transition: none; } }
@media print {
  @page { size: 1920px 1080px; margin: 0; }
  html, body { background: none; }
  #viewport { position: static; display: block; }
  #stage { transform: none !important; width: auto; height: auto; }
  .slide { position: relative; display: flex !important; width: 1920px; height: 1080px; break-after: page; }
  #nav, #notes { display: none !important; }
}
</style>
</head>
<body>
<div id="viewport"><div id="stage"></div></div>
<div id="nav">
  <button id="prev" type="button" aria-label="Previous slide">←</button>
  <span id="count">1 / 1</span>
  <button id="next" type="button" aria-label="Next slide">→</button>
  <button id="notesBtn" type="button">Notes (N)</button>
</div>
<div id="notes" hidden></div>

<!-- Code shown on the slides. Plain text; highlighted at load. -->
<script type="text/plain" id="code-ask">import type { Plugin } from "@opencode-ai/plugin"
import { score, TypeSafeClient } from "@typesafe-ai/sdk"

export const JevRouter: Plugin = async () => {
  const jev = new TypeSafeClient() // reads TYPESAFE_API_KEY

  return {
    // Runs once per user prompt, before opencode saves the message (session/prompt.ts:1037).
    "chat.message": async (_input, output) => {
      const latest = output.parts
        .flatMap((p) => (p.type === "text" && !p.synthetic ? [p.text] : []))
        .join("\n")

      // One request, one Score question per capability. Jev answers them in parallel.
      const { answers } = await jev.systemOne({
        model: "jev-1.13.0", // pinned: the thresholds are tuned per model version
        state: { latest_message: latest },
        questions: Object.fromEntries(ROSTER.map((c) => [c.id, score({
          capability: { name: c.id, kind: c.kind, description: c.description },
          question: "How much does the agent need `capability` to act on `latest_message`?",
        }, LEVELS)])),
      })</script>
<script type="text/plain" id="code-tools">      const KEEP = 0.8   // score, on the 0–2 scale
      const UNSURE = 0.3 // confidence; below it on a plausible match, send everything

      const unsure = ROSTER.some((c) => answers[c.id].score >= 0.5 && answers[c.id].confidence < UNSURE)
      const kept = ROSTER.filter((c) => unsure || answers[c.id].score >= KEEP)
      const skills = kept.filter((c) => c.kind === "skill")

      // Tools: switch off what Jev did not keep, for every step of this turn.
      // opencode drops them in LLMRequestPrep.resolveTools (session/llm/request.ts:210).
      output.message.tools = Object.fromEntries(
        ROSTER.filter((c) => c.kind === "tool" && !kept.includes(c)).map((c) => [c.id, false]),
      )
      if (skills.length === 0) output.message.tools.skill = false</script>
<script type="text/plain" id="code-skills">      // Skills: list the kept ones inside this message, so the system prompt never changes.
      if (skills.length > 0)
        output.parts.push({
          id: `prt_jev_${output.message.id}`, // any id that starts with "prt" is valid
          sessionID: output.message.sessionID,
          messageID: output.message.id,
          type: "text",
          synthetic: true,
          text: [
            "<relevant_skills>",
            ...skills.map((s) => `<skill><name>${s.id}</name><description>${s.description}</description></skill>`),
            "</relevant_skills>",
          ].join("\n"),
        })
    },

    // Remove the full index that SystemPrompt.skills renders (session/system.ts:110).
    "experimental.chat.system.transform": async (_input, output) => {
      output.system = output.system.map((s) => s.replace(/<available_skills>[\s\S]*?<\/available_skills>/, ""))
    },
  }
}</script>

<script>
// Verbatim: tool text from packages/opencode/src/tool/*.txt (bash rendered for macOS),
// skill text from the `description` frontmatter of .claude/skills/<name>/SKILL.md.
const ROSTER = [
 {
  "id": "read",
  "kind": "tool",
  "description": "Read a file or directory from the local filesystem. If the path does not exist, an error is returned.\n\nUsage:\n- The filePath parameter should be an absolute path.\n- By default, this tool returns up to 2000 lines from the start of the file.\n- The offset parameter is the line number to start from (1-indexed).\n- To read later sections, call this tool again with a larger offset.\n- Use the grep tool to find specific content in large files or files with long lines.\n- If you are unsure of the correct file path, use the glob tool to look up filenames by glob pattern.\n- Contents are returned with each line prefixed by its line number as `<line>: <content>`. For example, if a file has contents \"foo\\n\", you will receive \"1: foo\\n\". For directories, entries are returned one per line (without line numbers) with a trailing `/` for subdirectories.\n- Any line longer than 2000 characters is truncated.\n- Call this tool in parallel when you know there are multiple files you want to read.\n- Avoid tiny repeated slices (30 line chunks). If you need more context, read a larger window.\n- This tool can read image files and PDFs and return them as file attachments."
 },
 {
  "id": "glob",
  "kind": "tool",
  "description": "- Fast file pattern matching tool that works with any codebase size\n- Supports glob patterns like \"**/*.js\" or \"src/**/*.ts\"\n- Returns matching file paths\n- Use this tool when you need to find files by name patterns\n- When you are doing an open-ended search that may require multiple rounds of globbing and grepping, use the Task tool instead\n- You have the capability to call multiple tools in a single response. It is always better to speculatively perform multiple searches as a batch that are potentially useful."
 },
 {
  "id": "grep",
  "kind": "tool",
  "description": "- Fast content search tool that works with any codebase size\n- Searches file contents using regular expressions\n- Supports full regex syntax (eg. \"log.*Error\", \"function\\s+\\w+\", etc.)\n- Filter files by pattern with the include parameter (eg. \"*.js\", \"*.{ts,tsx}\")\n- Returns file paths and line numbers with matching lines\n- Use this tool when you need to find files containing specific patterns\n- If you need to identify/count the number of matches within files, use the Bash tool with `rg` (ripgrep) directly. Do NOT use `grep`.\n- When you are doing an open-ended search that may require multiple rounds of globbing and grepping, use the Task tool instead"
 },
 {
  "id": "edit",
  "kind": "tool",
  "description": "Performs exact string replacements in files. \n\nUsage:\n- You must use your `Read` tool at least once in the conversation before editing. This tool will error if you attempt an edit without reading the file. \n- When editing text from Read tool output, ensure you preserve the exact indentation (tabs/spaces) as it appears AFTER the line number prefix. The line number prefix format is: line number + colon + space (e.g., `1: `). Everything after that space is the actual file content to match. Never include any part of the line number prefix in the oldString or newString.\n- ALWAYS prefer editing existing files in the codebase. NEVER write new files unless explicitly required.\n- Only use emojis if the user explicitly requests it. Avoid adding emojis to files unless asked.\n- The edit will FAIL if `oldString` is not found in the file with an error \"oldString not found in content\".\n- The edit will FAIL if `oldString` is found multiple times in the file with an error \"Found multiple matches for oldString. Provide more surrounding lines in oldString to identify the correct match.\" Either provide a larger string with more surrounding context to make it unique or use `replaceAll` to change every instance of `oldString`. \n- Use `replaceAll` for replacing and renaming strings across the file. This parameter is useful if you want to rename a variable for instance."
 },
 {
  "id": "write",
  "kind": "tool",
  "description": "Writes a file to the local filesystem.\n\nUsage:\n- This tool will overwrite the existing file if there is one at the provided path.\n- If this is an existing file, you MUST use the Read tool first to read the file's contents. This tool will fail if you did not read the file first.\n- ALWAYS prefer editing existing files in the codebase. NEVER write new files unless explicitly required.\n- NEVER proactively create documentation files (*.md) or README files. Only create documentation files if explicitly requested by the User.\n- Only use emojis if the user explicitly requests it. Avoid writing emojis to files unless asked."
 },
 {
  "id": "bash",
  "kind": "tool",
  "description": "Executes a given bash command in a persistent shell session with optional timeout, ensuring proper handling and security measures.\n\nBe aware: OS: darwin, Shell: bash\n\nAll commands run in the current working directory by default. Use the `workdir` parameter if you need to run a command in a different directory. AVOID using `cd <directory> && <command>` patterns - use `workdir` instead.\n\nUse `$TMPDIR/opencode` for temporary work outside the workspace. This directory has already been created, already exists, and is pre-approved for external directory access.\n\nIMPORTANT: This tool is for terminal operations like git, npm, docker, etc. DO NOT use it for file operations (reading, writing, editing, searching, finding files) - use the specialized tools for this instead.\n\nBefore executing the command, please follow these steps:\n\n1. Directory Verification:\n   - If the command will create new directories or files, first use `ls` to verify the parent directory exists and is the correct location\n   - For example, before running \"mkdir foo/bar\", first use `ls foo` to check that \"foo\" exists and is the intended parent directory\n\n2. Command Execution:\n   - Always quote file paths that contain spaces with double quotes (e.g., rm \"path with spaces/file.txt\")\n   - Examples of proper quoting:\n     - mkdir \"/Users/name/My Documents\" (correct)\n     - mkdir /Users/name/My Documents (incorrect - will fail)\n     - python \"/path/with spaces/script.py\" (correct)\n     - python /path/with spaces/script.py (incorrect - will fail)\n   - After ensuring proper quoting, execute the command.\n   - Capture the output of the command.\n\nUsage notes:\n  - The command argument is required.\n  - You can specify an optional timeout in milliseconds. If not specified, commands will time out after 120000ms.\n  - If the output exceeds 2000 lines or 51200 bytes, it will be truncated and the full output will be written to a file. You can use Read with offset/limit to read specific sections or Grep to search the full content. Do NOT use `head`, `tail`, or other truncation commands to limit output; the full output will already be captured to a file for more precise searching.\n\n  - Avoid using Bash with the `find`, `grep`, `cat`, `head`, `tail`, `sed`, `awk`, or `echo` commands, unless explicitly instructed or when these commands are truly necessary for the task. Instead, always prefer using the dedicated tools for these commands:\n    - File search: Use Glob (NOT find or ls)\n    - Content search: Use Grep (NOT grep or rg)\n    - Read files: Use Read (NOT cat/head/tail)\n    - Edit files: Use Edit (NOT sed/awk)\n    - Write files: Use Write (NOT echo >/cat <<EOF)\n    - Communication: Output text directly (NOT echo/printf)\n  - When issuing multiple commands:\n    - If the commands are independent and can run in parallel, make multiple bash tool calls in a single message. For example, if you need to run \"git status\" and \"git diff\", send a single message with two bash tool calls in parallel.\n    - If the commands depend on each other and must run sequentially, use a single Bash call with '&&' to chain them together (e.g., `git add . && git commit -m \"message\" && git push`). For instance, if one operation must complete before another starts (like mkdir before cp, Write before Bash for git operations, or git add before git commit), run these operations sequentially instead.\n    - Use ';' only when you need to run commands sequentially but don't care if earlier commands fail\n    - DO NOT use newlines to separate commands (newlines are ok in quoted strings)\n  - AVOID using `cd <directory> && <command>`. Use the `workdir` parameter to change directories instead.\n    <good-example>\n    Use workdir=\"/foo/bar\" with command: pytest tests\n    <\/good-example>\n    <bad-example>\n    cd /foo/bar && pytest tests\n    <\/bad-example>\n\n# Git and GitHub\n- Only commit, amend, push, or create PRs when explicitly requested.\n- Before committing, inspect `git status`, `git diff`, and `git log --oneline -10`; stage only intended files and never commit secrets.\n- Write a concise commit message that matches the repo style.\n- Do not update git config, skip hooks, use interactive `-i`, force-push, or create empty commits unless explicitly requested.\n- If a commit fails or hooks reject it, fix the issue and create a new commit; do not amend the failed commit.\n- Before creating a PR, inspect status, diff, remote tracking, recent commits, and the diff from the base branch.\n- Review all commits included in the PR, not just the latest commit.\n- Use `gh` for GitHub tasks, including PRs, issues, checks, and releases; return the PR URL when done."
 },
 {
  "id": "webfetch",
  "kind": "tool",
  "description": "- Fetches content from a specified URL\n- Takes a URL and optional format as input\n- Fetches the URL content, converts to requested format (markdown by default)\n- Returns the content in the specified format\n- Use this tool when you need to retrieve and analyze web content\n\nUsage notes:\n  - IMPORTANT: if another tool is present that offers better web fetching capabilities, is more targeted to the task, or has fewer restrictions, prefer using that tool instead of this one.\n  - The URL must be a fully-formed valid URL\n  - HTTP URLs will be automatically upgraded to HTTPS\n  - Format options: \"markdown\" (default), \"text\", or \"html\"\n  - This tool is read-only and does not modify any files\n  - Results may be summarized if the content is very large"
 },
 {
  "id": "bmad-forge-idea",
  "kind": "skill",
  "description": "Test a half-formed idea in a questioning conversation, with different personas probing its weak points, until the user can act on it or drop it with confidence. Optionally writes a short brief for planning skills to build on. Use when the user says 'forge an idea', 'pressure-test this idea', 'stress-test my thinking', or 'harden this idea'"
 },
 {
  "id": "bmad-brainstorming",
  "kind": "skill",
  "description": "Facilitate a brainstorming session using diverse creative techniques. Use when the user says 'help me brainstorm' or 'help me ideate'"
 },
 {
  "id": "bmad-advanced-elicitation",
  "kind": "skill",
  "description": "Push the LLM to reconsider, refine, and improve its recent output. Use when user asks for deeper critique or mentions a known deeper critique method, e.g. socratic, first principles, pre-mortem, red team"
 },
 {
  "id": "bmad-deep-recon",
  "kind": "skill",
  "description": "Research a topic to support a decision, three ways: draft a research prompt for the user to run in their own tool (ChatGPT, Gemini, Grok, Perplexity, …), turn a finished research report into a short summary with cited sources that other skills can use directly, or run the research here with parallel web searches. Built-in research types: market, domain, technical, competitive, user-voice, academic-lit; also supports choosing between candidates, and custom types via overrides. Use when the user says \"deep recon\", \"research this\", \"draft a research prompt\", \"process this research report\", \"market research\", \"domain research\", \"technical research\", \"competitor research\", \"literature review\", or \"help me choose between\""
 },
 {
  "id": "bmad-spec",
  "kind": "skill",
  "description": "Condense any input — an idea, brief, PRD, transcript, or mixed notes — into a short spec: SPEC.md plus supporting files that downstream skills build from. Also updates and validates existing specs, and can break a spec into stories. Use when the user says \"create a spec\", \"distill this into a spec\", \"validate this spec\", \"update the spec\", or \"break this into stories\""
 },
 {

const probs = (v) => Array.isArray(v) ? v : [Math.max(0, 1 - v), 1 - Math.max(0, 1 - v) - Math.max(0, v - 1), Math.max(0, v - 1)];

function judge(turn, i) {

    answers[c.id] = { score: p[1] + 2 * p[2], confidence: confidence(p), probabilities: p };

  const unsure = ROSTER.some((c) => answers[c.id].score >= 0.5 && answers[c.id].confidence < UNSURE);
  const kept = ROSTER.filter((c) => unsure || answers[c.id].score >= KEEP);

probe.remove();
stage.innerHTML = S.map((s, i) => `<section class="slide ${s.cls}" aria-label="Slide ${i + 1}">${s.html}
  <div class="footer"><span>${esc(s.section)}</span><span>${i + 1} / ${S.length}</span></div></section>`).join("");
const slides = [...stage.children], notes = document.getElementById("notes");
let cur = 0;
function show(i) {
  cur = Math.max(0, Math.min(slides.length - 1, i));
  slides.forEach((s, j) => s.classList.toggle("on", j === cur));
  document.getElementById("count").textContent = `${cur + 1} / ${slides.length}`;
  notes.textContent = S[cur].notes ?? "";
  history.replaceState(null, "", `#${cur + 1}`);
}
function fit() {
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  stage.style.transform = `scale(${s})`;
}
addEventListener("resize", fit);
addEventListener("hashchange", () => { const n = parseInt(location.hash.slice(1), 10); if (n && n - 1 !== cur) show(n - 1); });
addEventListener("keydown", (e) => {
  if (["ArrowRight", "PageDown", " ", "l"].includes(e.key)) { e.preventDefault(); show(cur + 1); }
  else if (["ArrowLeft", "PageUp", "h"].includes(e.key)) { e.preventDefault(); show(cur - 1); }
  else if (e.key === "Home") show(0);
  else if (e.key === "End") show(slides.length - 1);
  else if (e.key === "n" || e.key === "N") notes.hidden = !notes.hidden;
  else if (e.key === "f") document.documentElement.requestFullscreen?.().catch(() => {});
});
document.getElementById("prev").onclick = () => show(cur - 1);
document.getElementById("next").onclick = () => show(cur + 1);
document.getElementById("notesBtn").onclick = () => (notes.hidden = !notes.hidden);
fit();
show((parseInt(location.hash.slice(1), 10) || 1) - 1);
}
