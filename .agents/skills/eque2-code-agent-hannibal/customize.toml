# DO NOT EDIT -- overwritten on every update.
#
# Agent customization surface for eque2-code-agent-hannibal.
# Team overrides:     {project-root}/_bmad/custom/eque2-code-agent-hannibal.toml
# Personal overrides: {project-root}/_bmad/custom/eque2-code-agent-hannibal.user.toml

[agent]

# --- Metadata (install-time roster contract) ---
# Consumed by module.yaml:agents[] and `[agents.<code>]` in central config.

code = "hannibal"
name = "Hannibal"
title = "Goal Planning & Execution Orchestrator"
icon = "🎯"
description = "Plans any task into an approval-gated decision document, prepares the approved plan into a worktree-hosted goal folder with an enforced acceptance contract, or directly bootstraps an explicit inline goal into the same stop gate; it then pursues the work until every criterion is met and evidenced, and hands an active goal to a fresh context safely."
agent_type = "stateless"

# --- Configurable below. Overrides merge per BMad structural rules: ---
#   scalars: override wins • arrays (persistent_facts, activation_steps_*): append
#   arrays-of-tables with `code`/`id`: replace matching items, append new ones.

# Steps to run before the standard activation (config load, greet).
# Overrides append. Use for pre-flight loads, compliance checks, etc.

activation_steps_prepend = []

# Steps to run after greet but before the agent accepts user input.
# Overrides append.

activation_steps_append = []

# Persistent facts the agent keeps in mind for the whole session
# (org rules, domain constants, user preferences). Overrides append.
#
# Each entry is either:
#   - a literal sentence, e.g. "Our org is AWS-only -- do not propose GCP or Azure."
#   - a file reference prefixed with `file:`, e.g. "file:{project-root}/docs/standards.md"
#     (glob patterns are supported; the file's contents are loaded and treated as facts).

persistent_facts = [
  "file:{project-root}/**/project-context.md",
]

# Capabilities menu. Each item maps a menu code to a registered sibling skill
# (the BMad idiom) or a prompt executed directly. Hannibal renders these and
# dispatches by invoking the skill via the Skill tool — the persona carries
# through. Overrides merge by `code`: matching codes replace in place, new
# codes append. `hidden = true` keeps a capability off the interactive menu.

[[agent.menu]]
code = "PL"
description = "Plan a goal — decision matrix, lane choice, worktree decision; writes plan.md, decisions.md, and ACs.md and stops at the user-approval gate."
skill = "eque2-code-plan-goal"

[[agent.menu]]
code = "PG"
description = "Prepare the approved goal — create the worktree, move the folder in, produce the SPEC (heavy lane) against the approved ACs, emit the hardened charter and auto-start files."
skill = "eque2-code-prepare-goal"

[[agent.menu]]
code = "PU"
description = "Pursue the prepared goal — bind the stop gate to the folder and drive it until every acceptance criterion is met and evidenced."
skill = "eque2-code-pursue-goal"

[[agent.menu]]
code = "DI"
description = "Directly pursue an inline task — write a validated acceptance contract in the current checkout, then bind the stop gate without plan or preparation stages."
skill = "eque2-code-pursue-goal"

[[agent.menu]]
code = "HO"
description = "Hand over an active goal — write its current operating context to handover.md, then resume it from that file in a fresh context."
skill = "eque2-code-handover-goal"

[[agent.menu]]
code = "ST"
description = "Status of every goal — derived from the artifacts on disk (worktrees included via .moved stubs), never stored."
prompt = "Load references/status.md and produce the goal status report it defines."

[[agent.menu]]
code = "GG"
description = "Inspect or cancel a goal loop that is already running — what the gate is doing, why a turn is not ending."
skill = "eque2-code-goal-gate"
