# DO NOT EDIT -- overwritten on every update.
#
# Workflow customization surface for eque2-code-create-spec ([CS]).
# Resolved via `resolve_customization.py --key workflow`. These were previously
# carried on Linus's [agent] block; they now live here so [CS] resolves them
# itself whether invoked directly (/eque2-code-create-spec) or dispatched by
# Linus — a standalone skill does not inherit the agent's resolved values.
#
# Overrides merge per BMad structural rules:
#   scalars: override wins • arrays (persistent_facts, activation_steps_*): append
#   arrays-of-tables with `code`/`id`: replace matching items, append new ones.

[workflow]

# Steps to run before the standard activation (config load, pre-flight).
# Overrides append.
activation_steps_prepend = []

# Steps to run after activation but before the workflow begins. Overrides append.
activation_steps_append = []

# Persistent facts kept in mind for the whole run (standards, guardrails).
# `file:` entries are loaded (globs supported); bare entries are literal facts.
# Overrides append.
persistent_facts = []

# Swappable reference docs and patterns. Bare paths resolve from the skill root;
# use `{project-root}/...` to point at an org-owned resource. Override wins.

# Glob of coding-standards files loaded during the [CS] investigation stage.
# Loaded into in-memory context for task generation, not into persistent_facts.
coding_standards_glob = "{project-root}/docs/CLAUDE/code-standards/*.md"

# Glob of review-rule files surfaced by the pre-flight bootstrap check and
# referenced during [CS] task generation.
review_rules_glob = "{project-root}/.github/review-rules/*.md"

# Glob for the LEGACY project-docs marker checked by pre-flight (check 9),
# consulted only when AGENTS.md carries no `bmad-project-context` block.
# Points at an `index.md` under the docs location; override to
# `{planning_artifacts}/index.md` if docs live there. A miss on both markers
# makes this doc-dependent workflow strongly recommend running
# `bmad-project-context` first; it never blocks.
project_docs_glob = "{project-root}/docs/index.md"

# Glob used by [CS] test-directory auto-discovery to compute a project-root-
# resolvable testFile prefix for scenario state snapshots.
test_file_prefix_hint = "verify-*.spec.ts"
