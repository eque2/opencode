name: Jira Verification

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: number
      jira_tickets:
        required: true
        type: string
    secrets:
      JIRA_BASE_URL:
        required: true
      JIRA_EMAIL:
        required: true
      JIRA_API_TOKEN:
        required: true
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  verify-jira:
    runs-on: ubuntu-latest
    steps:
      # pull_request_target: the default checkout is the base revision, so every
      # control file (scripts, prompts, local actions) comes from trusted code.
      - name: Checkout trusted base revision
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Jira verification
        uses: ./.github/actions/jira-integration
        with:
          jira_tickets: ${{ inputs.jira_tickets }}
          jira_base_url: ${{ secrets.JIRA_BASE_URL }}
          jira_email: ${{ secrets.JIRA_EMAIL }}
          jira_api_token: ${{ secrets.JIRA_API_TOKEN }}
          pr_number: ${{ inputs.pr_number }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
