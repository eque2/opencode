name: 'Jira Integration'
description: 'Fetch and verify Jira tickets for PR'
inputs:
  jira_tickets:
    description: 'Comma-separated list of Jira ticket IDs'
    required: true
  jira_base_url:
    description: 'Jira base URL'
    required: true
  jira_email:
    description: 'Jira email'
    required: true
  jira_api_token:
    description: 'Jira API token'
    required: true
  pr_number:
    description: 'PR number'
    required: true
  github_token:
    description: 'GitHub token'
    required: true
  claude_code_oauth_token:
    description: 'Claude Code OAuth token'
    required: true
outputs:
  jira_context:
    description: 'Jira ticket information'
    value: ${{ steps.fetch.outputs.jira_context }}
  jira_error:
    description: 'Whether an error occurred'
    value: ${{ steps.fetch.outputs.jira_error }}
runs:
  using: composite
  steps:
    - name: Fetch Jira tickets
      id: fetch
      shell: bash
      run: |
        # Validate script path to prevent path traversal
        # Note: TOCTOU race condition is minimal risk in GitHub Actions isolated runner environment
        SCRIPT_PATH="${{ github.action_path }}/../../scripts/fetch-jira-tickets.sh"
        SCRIPT_PATH=$(realpath "$SCRIPT_PATH")
        if [[ "$SCRIPT_PATH" != "${{ github.workspace }}"* ]]; then
          echo "Error: Script path outside workspace"
          exit 1
        fi
        # Execute script - file system is isolated to this workflow run
        "$SCRIPT_PATH" "$JIRA_TICKETS"
      env:
        JIRA_BASE_URL: ${{ inputs.jira_base_url }}
        JIRA_EMAIL: ${{ inputs.jira_email }}
        JIRA_API_TOKEN: ${{ inputs.jira_api_token }}
        JIRA_TICKETS: ${{ inputs.jira_tickets }}
      continue-on-error: true

    - name: Find previous Jira verification comment
      id: find-comment
      if: steps.fetch.outputs.jira_context != '' && steps.fetch.outputs.jira_error != 'true'
      uses: ./.github/actions/find-comment
      with:
        marker: '<!-- ai-workflow:jira-verification:${{ inputs.jira_tickets }} -->'
        pr_number: ${{ inputs.pr_number }}
        github_token: ${{ inputs.github_token }}

    - name: Build Jira verification prompt
      id: build-prompt
      if: steps.fetch.outputs.jira_context != '' && steps.fetch.outputs.jira_error != 'true'
      shell: bash
      run: |
        # Validate template file exists
        TEMPLATE_PATH="${{ github.action_path }}/../../prompts/jira-verification.md"
        if [ ! -f "$TEMPLATE_PATH" ]; then
          echo "Error: Jira verification prompt template not found at $TEMPLATE_PATH"
          exit 1
        fi

        # Read template after validation
        PROMPT_TEMPLATE=$(cat "$TEMPLATE_PATH")

        # Use environment variables to prevent command injection
        if [ -n "$COMMENT_ID" ]; then
          COMMENT_INSTRUCTION="Update the existing comment (ID: $COMMENT_ID) using:
           gh api repos/{owner}/{repo}/issues/comments/$COMMENT_ID -X PATCH -f body=\"<!-- ai-workflow:jira-verification:$JIRA_TICKETS -->
        <analysis>\""
        else
          COMMENT_INSTRUCTION="Create a new comment using:
           gh pr comment $PR_NUMBER --body \"<!-- ai-workflow:jira-verification:$JIRA_TICKETS -->
        <analysis>\""
        fi

        # Use heredoc and environment variables to safely handle multi-line content
        # Note: JIRA_CONTEXT comes from Jira API and is used only for prompt text (not executed)
        JIRA_CONTEXT="${JIRA_CONTEXT_VAR}"

        # Build prompt using safe string concatenation
        # Using printf instead of parameter substitution to avoid bash expansion issues
        {
          echo "Verify if this pull request fulfills the Jira ticket requirements."
          echo ""
          echo "$JIRA_CONTEXT"
          echo ""
          echo "## Verification Task"
          echo ""
          echo "1. Examine the PR changes using git diff"
          echo "2. Compare the implementation against the Jira ticket requirements"
          echo "3. Check if the code changes address the acceptance criteria"
          echo "4. $COMMENT_INSTRUCTION"
          echo ""
          echo "IMPORTANT: You MUST include the exact HTML comment marker above as the first line of your comment body."
          echo "This marker is invisible to users but required for workflow operation."
          echo ""
          echo "Include in your analysis:"
          echo ""
          echo "- Which acceptance criteria are met"
          echo "- Which acceptance criteria are missing or incomplete"
          echo "- Any implementation that goes beyond the ticket scope"
          echo "- Overall assessment: Does this PR fulfill the Jira ticket requirements?"
        } > /tmp/prompt.txt

        # Use static delimiter for better debuggability
        DELIMITER="EOF_PROMPT_MARKER"
        echo "prompt<<$DELIMITER" >> $GITHUB_OUTPUT
        cat /tmp/prompt.txt >> $GITHUB_OUTPUT
        echo "" >> $GITHUB_OUTPUT
        echo "$DELIMITER" >> $GITHUB_OUTPUT
      env:
        JIRA_CONTEXT_VAR: ${{ steps.fetch.outputs.jira_context }}
        COMMENT_ID: ${{ steps.find-comment.outputs.comment_id }}
        JIRA_TICKETS: ${{ inputs.jira_tickets }}
        PR_NUMBER: ${{ inputs.pr_number }}

    - name: Claude Code Jira Verification
      if: steps.fetch.outputs.jira_context != '' && steps.fetch.outputs.jira_error != 'true'
      uses: anthropics/claude-code-action@v1
      with:
        claude_code_oauth_token: ${{ inputs.claude_code_oauth_token }}
        github_token: ${{ inputs.github_token }}
        prompt: ${{ steps.build-prompt.outputs.prompt }}
        show_full_output: true
        # Write permission needed to create/update Jira verification comments on PR
        settings: |
          {
            "permissions": {
              "allow": ["Bash", "Read", "Write"]
            }
          }
      env:
        GH_TOKEN: ${{ inputs.github_token }}
